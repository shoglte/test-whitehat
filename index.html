<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snapchat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- الكاميرا -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- طبقة الفلتر -->
    <div class="filter-overlay" id="filterOverlay"></div>

    <!-- واجهة سناب شات -->
    <div class="snap-container">
        
        <!-- البار العلوي -->
        <div class="top-bar">
            <div class="top-left">
                <span class="icon" onclick="toggleFlash()">⚡</span>
            </div>
            <div class="top-center">
                <span class="filter-name" id="filterName">Normal</span>
            </div>
            <div class="top-right">
                <span class="icon" onclick="switchCamera()">🔄</span>
            </div>
        </div>

        <!-- الفلاتر - زرارين يمين وشمال -->
        <div class="filter-controls">
            <button class="filter-btn" onclick="prevFilter()">◀</button>
            <button class="filter-btn" onclick="nextFilter()">▶</button>
        </div>

        <!-- زر الالتقاط -->
        <div class="capture-area">
            <div class="capture-ring" id="captureBtn">
                <div class="capture-inner"></div>
            </div>
        </div>

        <!-- البار السفلي -->
        <div class="bottom-bar">
            <div class="bottom-left">
                <span class="icon">📷</span>
            </div>
            <div class="bottom-center">
                <span class="icon">💬</span>
            </div>
            <div class="bottom-right">
                <span class="icon">👥</span>
            </div>
        </div>

        <!-- شريط التسجيل -->
        <div class="recording-bar" id="recordingBar">
            <div class="recording-progress" id="recordingProgress"></div>
            <span class="recording-time" id="recordingTime">00:00</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
